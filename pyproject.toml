[project]
name = "golemio-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing the Prague Golemio open-data API (PID transit departures + city datasets)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pavel Yushkov" }]
dependencies = [
    "mcp[cli]>=1.2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/golemio_mcp"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
# Put the repo root on sys.path so `from src.golemio_mcp import server` resolves under
# both `python -m pytest` and the `uv run pytest` console script (matches the src-layout
# entrypoint `python -m src.golemio_mcp.server`).
pythonpath = ["."]
